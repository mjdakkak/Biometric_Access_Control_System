<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <section class="card">

            <h2>Admin Login</h2>

            <form id="login-form">

                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <div id="login-result"></div>

        </section>

    </div>

    <script src="login.js"></script>

</body>

</html>
