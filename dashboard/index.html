<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biometric Access Admin</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <div class="page-header">
            <h1>Biometric Access Control</h1>

            <div class="header-actions">
                <a class="nav-link" href="settings.html">
                    Settings
                </a>

                <a class="nav-link" href="access.html">
                    Access Attempts
                </a>

                <button
                    type="button"
                    class="logout-button"
                    onclick="logout()"
                >
                    Logout
                </button>
            </div>
        </div>

        <section class="card">

            <h2>Add User</h2>

            <form id="add-user-form">

                <label for="first-name">First Name</label>

                <input
                    type="text"
                    id="first-name"
                    required
                >

                <label for="last-name">Last Name</label>

                <input
                    type="text"
                    id="last-name"
                    required
                >

                <label for="pin">4-Digit PIN</label>

                <input
                    type="text"
                    id="pin"
                    maxlength="4"
                    inputmode="numeric"
                    pattern="[0-9]{4}"
                    required
                >

                <button type="submit">
                    Create User
                </button>

            </form>

            <div id="result"></div>

        </section>

        <section class="card">

            <h2>Users</h2>

            <input
                type="text"
                id="employee-search"
                placeholder="Search by Employee ID"
            >

            <table id="users-table">

                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Employee ID</th>
                        <th>Name</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="users-body"></tbody>

            </table>

        </section>

    </div>


    <!-- Edit user modal -->
    <div id="edit-modal" class="modal">

        <div class="modal-content">

            <h2>Edit User</h2>

            <label for="edit-first-name">First Name</label>

            <input
                type="text"
                id="edit-first-name"
            >

            <label for="edit-last-name">Last Name</label>

            <input
                type="text"
                id="edit-last-name"
            >

            <div class="modal-actions">

                <button
                    type="button"
                    onclick="saveUserEdit()"
                >
                    Save
                </button>

                <button
                    type="button"
                    onclick="closeEditModal()"
                >
                    Cancel
                </button>

            </div>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
